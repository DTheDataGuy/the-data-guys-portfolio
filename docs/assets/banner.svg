<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#0F1E36"/>
      <stop offset="1" stop-color="#10324A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <!-- data motif: bars + line -->
  <g transform="translate(900,70)" opacity="0.9">
    <rect x="0" y="150" width="34" height="70" rx="4" fill="#22D3EE" fill-opacity="0.25"/>
    <rect x="50" y="110" width="34" height="110" rx="4" fill="#22D3EE" fill-opacity="0.35"/>
    <rect x="100" y="130" width="34" height="90" rx="4" fill="#22D3EE" fill-opacity="0.3"/>
    <rect x="150" y="70" width="34" height="150" rx="4" fill="#34D399" fill-opacity="0.45"/>
    <rect x="200" y="40" width="34" height="180" rx="4" fill="#34D399" fill-opacity="0.6"/>
    <rect x="250" y="10" width="34" height="210" rx="4" fill="#34D399" fill-opacity="0.8"/>
    <polyline points="17,140 67,100 117,118 167,60 217,32 267,4" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <g fill="#E6FFFA"><circle cx="17" cy="140" r="5"/><circle cx="67" cy="100" r="5"/><circle cx="117" cy="118" r="5"/><circle cx="167" cy="60" r="5"/><circle cx="217" cy="32" r="5"/><circle cx="267" cy="4" r="5"/></g>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="64" width="64" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="104" fill="#7DD3FC" font-size="18" font-weight="600" letter-spacing="3">THE DATA GUYS™ · ENGINEERING PORTFOLIO</text>
    <text x="72" y="166" fill="#FFFFFF" font-size="54" font-weight="800">Dei'Marlon Scisney</text>
    <text x="72" y="210" fill="#CBD5E1" font-size="22" font-weight="400">Python · SQL · Polars · Apache Spark · Scala · dbt · Full-stack · Civic analytics</text>
    <g font-size="16" font-weight="600">
      <rect x="72" y="248" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="147" y="273" fill="#E2E8F0" text-anchor="middle">26 projects</text>
      <rect x="236" y="248" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="311" y="273" fill="#E2E8F0" text-anchor="middle">12 clients</text>
      <rect x="400" y="248" width="190" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="495" y="273" fill="#E2E8F0" text-anchor="middle">71K+ lines of code</text>
      <rect x="604" y="248" width="170" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="689" y="273" fill="#E2E8F0" text-anchor="middle">11 live apps</text>
    </g>
  </g>
