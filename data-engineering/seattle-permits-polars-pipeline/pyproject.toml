[project]
name = "permits-pipeline"
version = "1.0.0"
description = "Medallion (bronze/silver/gold) pipeline for Seattle building permits, built on Polars."
requires-python = ">=3.10"
dependencies = ["polars>=1.0", "pyarrow>=15", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
permits-pipeline = "permits_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
